<div class="modal fade" id="nodeTrayModal" tabindex="-1" aria-labelledby="nodeTrayModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="nodeTrayModalLabel">Node Tray</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="table-responsive">
            <table class="table table-sm">
              <thead>
                <tr>
                  <th>Node Name</th>
                  <th>Clamp</th>
                  <th>State</th>
                  <th>Initial Concentration</th>
                </tr>
              </thead>
              <tbody id="nodeTrayBody">
                <!-- This will be populated dynamically -->
              </tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary btn-sm" id="saveNodeTray">Save changes</button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Simulation Results Modal: 80vw × 90vh (10% margin on each side) -->
  <style>
    #simulation-modal .modal-dialog {
      max-width: 80vw;
      width: 80vw;
      max-height: 90vh;
      margin: 5vh auto;
    }
    #simulation-modal .modal-content {
      max-height: 90vh;
      overflow: hidden;
    }
    /* min-height: 0 + flex:1 lets the body shrink below content size,
       so the image's max-width/max-height actually clamp it. */
    #simulation-modal .modal-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      padding: 0;
    }
    #simulation-modal #plot-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #simulation-modal #plot-container img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
    }
  </style>
  <div id="simulation-modal" class="modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Simulation Results</h5>
          <div class="ms-auto d-flex align-items-center gap-2">
            <button type="button" class="btn btn-outline-primary btn-sm" id="download-results-csv">
              <i class="fas fa-download"></i> Download CSV
            </button>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
        </div>
        <div class="modal-body">
          <div id="plot-container"></div>
        </div>
      </div>
    </div>
  </div>
